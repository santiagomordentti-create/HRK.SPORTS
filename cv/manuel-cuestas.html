<!DOCTYPE html>

<head>

<meta name="robots" content="index, follow">
<meta property="og:type" content="profile">
<meta property="og:title" content="Manuel Cuestas — Defensor central, FK Jezero">
<meta property="og:description" content="Perfil deportivo de Manuel Cuestas. Producido por HRK Sports.">

<!-- =====================================================================
     BLOQUE DE DATOS — lo único que cambia de un jugador a otro.
     Para sumar un jugador nuevo: copiar este archivo entero y reemplazar
     SOLO lo que hay entre estas marcas. No hace falta tocar cv.css ni cv.js.

     Un campo en null se muestra como guion largo (—) en la ficha y se
     lista aparte como dato pendiente. No completar con estimaciones:
     lo que no está confirmado va en null hasta que se confirme.
     ===================================================================== -->
<script>
window.CV_DATA = {
  name: "Manuel Cuestas",
  lastName: "Cuestas", // el apellido que se arma en la entrada del CV
  number: 5,
  position: "Defensor central",

  club: {
    name: "FK Jezero",
    // Celeste y azul sacados del escudo y la camiseta — no del violeta
    // de la tarjeta de credencial, que es sólo la plantilla genérica.
    theme: { deep: "#061A22", base: "#092733", mid: "#11495F", light: "#1F85AD", label: "#5ABBE2", accent: "#ECF1F6" }
  },

  // Confirmados por fuente pública, pendientes de que el jugador los
  // valide — no son datos que él mismo nos haya dado todavía.
  nationality: "Argentina", // fuente pública, pendiente de confirmación del jugador
  birth: "13 de febrero de 2004", // fuente pública, pendiente de confirmación del jugador
  foot: null, // sin dato
  height: null, // sin dato

  career: ["Vardar", "Brera Strumica"],

  // Sin stats todavía: no se agrega el campo, así el bloque de
  // estadísticas de la cancha directamente no aparece (nada de ceros
  // ni de "sin datos" de relleno).

  instagram: { handle: "@manuelcuestasp", url: "https://www.instagram.com/manuelcuestasp/" },

  photo: {
    src: "../assets/manu.jpg",
    // Todavía no hay una foto propia: el panel de foto muestra la
    // credencial completa. isCredential:true apaga el nombre superpuesto
    // y la marca de agua de la entrada — el nombre ya está impreso
    // adentro de la credencial, repetirlo lo triplicaba en el mismo
    // cuadrante.
    isCredential: true,
    alt: "Credencial deportiva de Manuel Cuestas para HRK Sports, con su foto, el dorsal 05 y los datos de FK Jezero."
  },

  video: {
    src: null,   // ej: "../assets/cuestas-highlights.mp4"
    poster: null,
    alt: "Highlights de Manuel Cuestas"
  }
};
</script>
<!-- ================= FIN DEL BLOQUE DE DATOS ================= -->
</head>
<body>

<main class="cv">
  <div class="cv__top">
    <a class="back" href="../index.html#deportistas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      Volver a HRK Sports
    </a>
  </div>

  <header class="cv-header">
    <h1 class="cv-header__name" data-cv="header-name"></h1>
    <p class="cv-header__meta" data-cv="header-meta"></p>
  </header>

  <div class="grid">
    <!-- arriba izquierda: foto -->
    <section class="zone zone--photo" data-cv="photo" aria-label="Foto del jugador"></section>

    <!-- arriba derecha: cancha horizontal con la posición marcada -->
    <section class="card card--pitch" aria-labelledby="pos-t">
      <h2 class="card__label" id="pos-t">Posición</h2>
      <div class="pitch" data-cv="pitch"></div>
      <p class="pitch-desc" data-cv="pitch-desc"></p>
      <div class="pitch-stats" data-cv="pitch-stats"></div>
    </section>

    <!-- abajo izquierda: ficha de datos -->
    <section class="card card--facts" aria-labelledby="ficha-t">
      <h2 class="card__label" id="ficha-t">Ficha</h2>
      <ul class="facts" data-cv="facts"></ul>
    </section>

    <!-- abajo derecha: video de highlights (reservado hasta que llegue el archivo) -->
    <section class="zone zone--video" data-cv="video" aria-label="Video de highlights"></section>
  </div>

  <footer class="cv__foot">
    <span class="sig">Material producido por <strong>HRK Sports</strong></span>
  </footer>
</main>

<script src="cv.js"></script>
</body>
</html>
