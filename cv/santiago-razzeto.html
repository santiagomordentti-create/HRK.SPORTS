<!-- =====================================================================
     BLOQUE DE DATOS — lo único que cambia de un jugador a otro.
     Para sumar un jugador nuevo: copiar este archivo entero y reemplazar
     SOLO lo que hay entre estas marcas. No hace falta tocar cv.css ni cv.js.

     Un campo en null se muestra como guion largo (—) en la ficha y se
     lista aparte como dato pendiente. No completar con estimaciones:
     lo que no está confirmado va en null hasta que se confirme.
     ===================================================================== -->
<script>
window.CV_DATA = {
  name: "Santiago Razzeto",
  lastName: "Razzeto", // el apellido que se arma en la entrada del CV
  number: 1,
  position: "Arquero",

  club: {
    name: "Técnico Universitario",
    // Verde botella sacado de la camiseta (no del rojo de la tarjeta de
    // credencial, que es sólo la plantilla genérica de la credencial y
    // no el color real del club).
    theme: { deep: "#081C17", base: "#0C2A23", mid: "#174F42", light: "#2E9E84", label: "#41C8A9", accent: "#FFFFFF" }
  },

  // Confirmados por fuente pública, pendientes de que el jugador los
  // valide — no son datos que él mismo nos haya dado todavía.
  nationality: null, // sin dato
  birth: "5 de mayo de 2001", // fuente pública, pendiente de confirmación del jugador
  foot: "Derecho", // fuente pública, pendiente de confirmación del jugador
  height: "1,93 m", // fuente pública, pendiente de confirmación del jugador

  career: ["Belgrano (formativas)", "Independiente Rivadavia", "Academia Deportiva Cantolao"],

  stats: { matches: 17, minutes: 1530, goalsConceded: 23, cleanSheets: 4 },

  instagram: { handle: "@santirazzeto_1", url: "https://www.instagram.com/santirazzeto_1/" },

  photo: {
    src: "../assets/santi.jpg",
    // Todavía no hay una foto propia: el panel de foto muestra la
    // credencial completa. isCredential:true apaga el nombre superpuesto
    // y la marca de agua de la entrada — el nombre ya está impreso
    // adentro de la credencial, repetirlo lo triplicaba en el mismo
    // cuadrante.
    isCredential: true,
    alt: "Credencial deportiva de Santiago Razzeto para HRK Sports, con su foto, el dorsal 01 y los datos de Técnico Universitario."
  },

  video: {
    src: null,   // ej: "../assets/razzeto-highlights.mp4"
    poster: null,
    alt: "Highlights de Santiago Razzeto"
  }
};
</script>
